<script>
/* ===================== SETTINGS (same database as the website) ===================== */
const CONFIG = {

  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZHRzbnVocGRydGdpcmt3ZXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTc4MjYsImV4cCI6MjEwNzI5MzgyNn0.HXl6J_-MVp7D6uku2fZoyQGFgOMFK5ue9V33WzLXEgQ'
};
const WEEK_START = 6;          // week starts on: 6 = Samedi (0 = Dimanche, 1 = Lundi)
const WEEK_DAYS = 6;           // days shown (6 = Samedi → Jeudi, 7 = whole week)
const DEFAULT_STD = '08:30';
const CURRENCY = 'DA';
const BREAK_MINUTES = 0;       // minutes removed from each worked day (e.g. 60 = 1h lunch)
const DAY_NAMES = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const DOC_BUCKET = 'worker-docs';     // private Supabase Storage bucket (created by add-worker-documents.sql)
const DOC_MAX_MB = 10;
const DOC_TYPES = [                   // one PDF per type per employee; add a line here to add another type
  { key: 'birth_certificate', label: 'Acte de naissance' },
  { key: 'id_card', label: "Carte d'identité" }
];
const DEMO = new URLSearchParams(location.search).has('demo');

/* ===================== HELPERS ===================== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStartOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() - WEEK_START + 7) % 7)); };
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const t5 = t => String(t || '').slice(0, 5);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stdOf = w => t5(w && w.std_check_in) || DEFAULT_STD;
const initials = n => String(n || '?').split(' ').filter(Boolean).map(s => s[0]).slice(0, 2).join('').toUpperCase();
const toMin = t => { const p = String(t || '0:0').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const fmtH = m => { m = Math.round(m); return Math.floor(m / 60) + 'h' + pad(m % 60); };
const num = (n, d) => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d == null ? 0 : d });
const money = (n, d) => num(n, d) + ' ' + CURRENCY;
const frDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '-';
const sexLabel = x => x === 'M' ? 'Homme' : x === 'F' ? 'Femme' : '-';
function ageOf(b) {
  if (!b) return null;
  const d = new Date(b + 'T00:00:00'), n = new Date();
  let a = n.getFullYear() - d.getFullYear();
  if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--;
  return a;
}
function seniority(h) {
  if (!h) return '';
  const s0 = new Date(h + 'T00:00:00'), n = new Date();
  let mo = (n.getFullYear() - s0.getFullYear()) * 12 + n.getMonth() - s0.getMonth();
  if (n.getDate() < s0.getDate()) mo--;
  if (mo < 0) return '';
  const y = Math.floor(mo / 12), r = mo % 12;
  return [y ? y + (y > 1 ? ' ans' : ' an') : '', r ? r + ' mois' : ''].filter(Boolean).join(' ') || "moins d'un mois";
}
function friendlyError(e) {
  const m = String((e && e.message) || e);
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Pas de connexion internet.';
  if (/row-level security|permission denied/i.test(m)) return "Accès refusé : ce compte n'est pas autorisé à voir les données.";
  if (/Bucket not found/i.test(m)) return "Stockage non configuré : exécutez add-worker-documents.sql dans Supabase.";
  if (/schema cache|does not exist|Could not find the/i.test(m)) return "La base de données n'est pas à jour : exécutez add-worker-info.sql dans Supabase.";
  return m;
}
const ICON = {
  refresh: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>',
  left: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>'
};

/* ===================== STATE ===================== */
let sb = null, workers = [], weeks = {}, weekOffset = 0, busy = false, started = false;
let docs = {}, docBusy = {}, demoDocs = {};   // docs[workerId] = { kind: {size, at} }
let timersOn = false, loadError = '', updatedAt = null, query = '', openId = null, listScroll = 0, cameFromList = false, installEvt = null;
const app = () => document.getElementById('app');
const weekStartStr = () => ymd(addDays(weekStartOf(new Date()), weekOffset * 7));
const datesOf = ws => { const s = new Date(ws + 'T00:00:00'); return Array.from({ length: WEEK_DAYS }, (_, i) => { const d = addDays(s, i); return { d, s: ymd(d) }; }); };

/* ===================== DATA ===================== */
let demoPunches = [];
if (DEMO) {
  const mk = (id, n, d, dev, x) => Object.assign({ id, device_user_id: dev, full_name: n, department: d, std_check_in: '08:30:00', active: true, created_at: '2022-01-01T00:00:00Z' }, x);
  workers = [
    mk('w1', 'Redouane Khelifi', 'Électronique', '1', { birth_date: '1995-03-12', sex: 'M', hire_date: '2022-09-01', hourly_rate: 250 }),
    mk('w2', 'Amine Benali', 'Vêtements / Mode', '2', { birth_date: '1999-07-30', sex: 'M', hire_date: '2024-02-15', hourly_rate: 220 }),
    mk('w3', 'Sarah Toumi', 'Cosmétiques', '3', { birth_date: '2001-11-05', sex: 'F', hire_date: '2025-06-01', hourly_rate: 230 }),
    mk('w4', 'Karim Mansouri', 'Maison & Déco', '4', { birth_date: '1990-01-20', sex: 'M', hire_date: '2020-01-10', hourly_rate: 280 }),
    mk('w5', 'Yassine Brahimi', 'Caisse Principale', '5', { birth_date: '1997-05-17', sex: 'M', hire_date: '2023-04-03', hourly_rate: null })
  ];
  const offs = [18, 22, 35, 12, 28, 45, 8], todayS = ymd(new Date());
  for (const wo of [0, -1]) {
    const ws = addDays(weekStartOf(new Date()), wo * 7);
    for (let k = 0; k < WEEK_DAYS; k++) {
      const d = addDays(ws, k), ds = ymd(d); if (ds > todayS) continue;
      workers.forEach((w, i) => {
        if (i === 3 && k === 1) return;
        demoPunches.push({ worker_id: w.id, punched_at: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0 + offs[(i * 2 + k) % offs.length]).toISOString() });
        if (ds < todayS && !(i === 2 && k === 2)) demoPunches.push({ worker_id: w.id, punched_at: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 17, 5 + i * 3).toISOString() });
      });
    }
  }
}
async function fetchAll(table, build) {              // Supabase returns max 1000 rows per request: read page by page
  let all = [], from = 0; const step = 1000;
  for (;;) {
    const { data, error } = await build(sb.from(table)).range(from, from + step - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < step) break; from += step;
  }
  return all;
}
async function loadWorkers() {
  if (!DEMO) workers = await fetchAll('workers', q => q.select('*').order('id'));
  workers = workers.filter(w => w.active).sort((a, b) => a.full_name.localeCompare(b.full_name, 'fr'));
}
async function loadWeek(ws, force) {
  const c = weeks[ws];
  if (c && !force && Date.now() - c.at < 20000) return c;
  const start = new Date(ws + 'T00:00:00'), end = addDays(start, 7);
  let pr, ov = [];
  if (DEMO) pr = demoPunches.filter(p => new Date(p.punched_at) >= start && new Date(p.punched_at) < end);
  else {
    [pr, ov] = await Promise.all([
      fetchAll('attendance_punches', q => q.select('id,worker_id,punched_at').gte('punched_at', start.toISOString()).lt('punched_at', end.toISOString()).order('id')),
      fetchAll('attendance_days', q => q.select('*').gte('work_date', ws).lt('work_date', ymd(end)).order('id'))
    ]);
  }
  const pIdx = {}, oIdx = {};
  pr.forEach(p => { const d = new Date(p.punched_at), k = p.worker_id + '_' + ymd(d); (pIdx[k] = pIdx[k] || []).push(d); });
  Object.values(pIdx).forEach(a => a.sort((x, y) => x - y));
  ov.forEach(o => { oIdx[o.worker_id + '_' + o.work_date] = o; });
  return (weeks[ws] = { pIdx, oIdx, at: Date.now() });
}

/* ===================== COMPUTE ===================== */
// one employee, one day: entry = 1st punch, exit = last punch (a manual edit made on the website wins)
function dayState(w, ds, wk) {
  const std = stdOf(w), k = w.id + '_' + ds, ov = wk.oIdx[k], today = ymd(new Date());
  let inT = '', outT = '', manual = false;
  if (ov) {
    if (ov.status === 'absent') return { st: 'absent' };
    inT = t5(ov.check_in); outT = t5(ov.check_out); manual = true;
  } else {
    const arr = wk.pIdx[k];
    if (!arr || !arr.length) {
      const now = new Date(), start = w.hire_date || (w.created_at ? ymd(new Date(w.created_at)) : '0000-00-00');
      const past = ds < today || (ds === today && now.getHours() >= 12);
      return { st: past && ds >= start ? 'absent' : 'none' };
    }
    const a = arr[0], b = arr[arr.length - 1];
    inT = hhmm(a); outT = (b - a) >= 5 * 60000 ? hhmm(b) : '';
  }
  const late = inT > std ? toMin(inT) - toMin(std) : 0;
  if (!outT) return { st: ds === today ? 'ongoing' : 'noout', in: inT, late, manual };
  return { st: 'ok', in: inT, out: outT, m: Math.max(0, toMin(outT) - toMin(inT) - BREAK_MINUTES), late, manual };
}
function weekTotals(w, dates, wk) {
  let m = 0, missing = 0, days = 0;
  dates.forEach(x => { const r = dayState(w, x.s, wk); if (r.st === 'ok') { m += r.m; days++; } else if (r.st === 'noout') missing++; });
  const rate = Number(w.hourly_rate) || 0;
  return { m, missing, days, rate, pay: Math.round(m / 60 * rate) };
}

/* ===================== RENDER ===================== */
const avatar = (w, big) => w.photo
  ? `<img class="av${big ? ' big' : ''}" src="${esc(w.photo)}" alt="">`
  : `<div class="av${big ? ' big' : ''}">${esc(initials(w.full_name))}</div>`;

function weekBar(dates) {
  const f = x => DAY_NAMES[x.d.getDay()].slice(0, 3) + ' ' + pad(x.d.getDate()) + '/' + pad(x.d.getMonth() + 1);
  const sub = weekOffset === 0 ? 'Semaine en cours' : weekOffset === -1 ? 'Semaine dernière' : weekOffset < 0 ? 'Il y a ' + (-weekOffset) + ' semaines' : 'Dans ' + weekOffset + ' semaines';
  return `<div class="wbar"><button class="ib" onclick="changeWeek(-1)" aria-label="Semaine précédente">${ICON.left}</button>
    <div class="lbl">${f(dates[0])} → ${f(dates[dates.length - 1])}<small>${sub}</small></div>
    ${weekOffset !== 0 ? '<button class="now" onclick="changeWeek(0)">Aujourd\'hui</button>' : ''}
    <button class="ib" onclick="changeWeek(1)" aria-label="Semaine suivante">${ICON.right}</button></div>`;
}
function header(sub, backBtn) {
  return `<div class="top"><div class="logo">M</div><div class="ttl"><b>MAXI BAZAR</b><small>${esc(sub)}</small></div>
    ${installEvt ? `<button class="pill" onclick="installApp()">Installer</button>` : ''}
    <button class="ib ${busy ? 'spin' : ''}" onclick="refresh(true)" aria-label="Actualiser">${ICON.refresh}</button></div>`;
}
const loadingBlock = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

function cardsHTML() {
  const ws = weekStartStr(), dates = datesOf(ws), wk = weeks[ws];
  if (!wk) return loadError ? '' : loadingBlock;
  const q = query.trim().toLowerCase();
  const list = workers.filter(w => !q || w.full_name.toLowerCase().includes(q) || String(w.department || '').toLowerCase().includes(q));
  if (!list.length) return `<div class="empty">${workers.length ? 'Aucun résultat.' : 'Aucun employé.'}</div>`;
  return list.map(w => {
    const t = weekTotals(w, dates, wk);
    return `<button class="wc" onclick="openWorker('${esc(w.id)}')">${avatar(w)}
      <div class="nm"><b>${esc(w.full_name)}</b><small>${esc(w.department || 'Sans rayon')}${t.missing ? ' · <span class="warn">⚠ sortie manquante</span>' : ''}</small></div>
      <div class="rt"><b>${fmtH(t.m)}</b><small class="${t.rate ? 'ok' : 'dim'}">${t.rate ? esc(money(t.pay)) : 'tarif ?'}</small></div></button>`;
  }).join('');
}
function listHTML() {
  const ws = weekStartStr(), dates = datesOf(ws), wk = weeks[ws];
  let totM = 0, totPay = 0;
  if (wk) workers.forEach(w => { const t = weekTotals(w, dates, wk); totM += t.m; totPay += t.pay; });
  return `<div class="wrap">${header(`${workers.length} employé${workers.length > 1 ? 's' : ''}`)}
    ${weekBar(dates)}
    ${loadError ? `<div class="err">${esc(loadError)}</div>` : ''}
    ${wk ? `<div class="sum"><div class="kpi hl"><small>Total salaires</small><b class="ok">${esc(money(totPay))}</b></div><div class="kpi"><small>Heures totales</small><b>${fmtH(totM)}</b></div></div>` : ''}
    <div class="srow"><input class="search" type="search" placeholder="Rechercher un employé…" value="${esc(query)}" oninput="onSearch(this.value)" autocomplete="off"><button class="addb" onclick="openForm()">+ Ajouter</button></div>
    <div id="cards">${cardsHTML()}</div>
    <div class="foot">${updatedAt ? 'Mis à jour à ' + hhmm(updatedAt) : ''}<br><button onclick="logout()">Déconnexion</button></div></div>`;
}
function detailHTML(w) {
  const ws = weekStartStr(), dates = datesOf(ws), wk = weeks[ws], a = ageOf(w.birth_date), sn = seniority(w.hire_date);
  const t = wk ? weekTotals(w, dates, wk) : null;
  const days = wk ? dates.map(x => {
    const r = dayState(w, x.s, wk), nm = `<div class="dn"><b>${DAY_NAMES[x.d.getDay()]}</b><span>${pad(x.d.getDate())}/${pad(x.d.getMonth() + 1)}</span></div>`;
    const lateTxt = r.late ? `<small class="warn">retard ${r.late} min</small>` : '';
    if (r.st === 'ok') return `<div class="day">${nm}<div class="dm">${esc(r.in)} → ${esc(r.out)}${r.manual ? ' *' : ''}${lateTxt}</div><div class="dh ok">${fmtH(r.m)}</div></div>`;
    if (r.st === 'ongoing') return `<div class="day">${nm}<div class="dm">${esc(r.in)} → <span class="mut">…</span>${lateTxt}</div><div class="dh mut">en cours</div></div>`;
    if (r.st === 'noout') return `<div class="day">${nm}<div class="dm">${esc(r.in)} → <span class="warn">?</span><small class="warn">sortie non enregistrée</small></div><div class="dh warn">⚠</div></div>`;
    if (r.st === 'absent') return `<div class="day">${nm}<div class="dm bad">Absent</div><div class="dh dim">-</div></div>`;
    return `<div class="day">${nm}<div class="dm dim">-</div><div class="dh dim"></div></div>`;
  }).join('') : loadingBlock;
  const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
  return `<div class="wrap">${header('Fiche employé')}
    <button class="back" onclick="goBack()">${ICON.left} Tous les employés</button>
    <div class="hd">${avatar(w, true)}<div style="min-width:0"><h1>${esc(w.full_name)}</h1><p>${esc(w.department || 'Sans rayon')}</p><span class="id">#${esc(w.device_user_id)}</span></div></div>
    <div class="card"><h2>Informations</h2>
      ${row('Sexe', esc(sexLabel(w.sex)))}
      ${row('Date de naissance', w.birth_date ? `${frDate(w.birth_date)} · ${a} ans` : '-')}
      ${row('Début de travail', w.hire_date ? `${frDate(w.hire_date)}${sn ? '<br><span class="mut" style="font-weight:500;font-size:12px">' + esc(sn) + '</span>' : ''}` : '-')}
      ${row('Arrivée prévue', esc(stdOf(w)))}
      ${row('Salaire par heure', w.hourly_rate ? esc(money(w.hourly_rate, 2)) : '<span class="dim">à définir</span>')}
    </div>
    ${docsCardHTML(w)}
    <div class="acts"><button class="btn em" onclick="openForm('${esc(w.id)}')">Modifier</button><button class="btn rs" onclick="removeWorker('${esc(w.id)}')">Supprimer</button></div>
    ${weekBar(dates)}
    ${loadError ? `<div class="err">${esc(loadError)}</div>` : ''}
    ${t ? `<div class="sum"><div class="kpi"><small>Heures de la semaine</small><b>${fmtH(t.m)}</b></div>
      <div class="kpi hl"><small>Salaire de la semaine</small><b class="ok">${t.rate ? esc(money(t.pay)) : '<span class="dim" style="font-size:15px">tarif à définir</span>'}</b></div></div>` : ''}
    <div class="card"><h2>Entrées et sorties</h2>${days}
      ${t ? `<div class="tot"><span>Total · ${t.days} jour${t.days > 1 ? 's' : ''}</span><span>${fmtH(t.m)}${t.rate ? ' · <span class="ok">' + esc(money(t.pay)) + '</span>' : ''}</span></div>` : ''}
      ${t && t.missing ? `<p class="warn" style="font-size:12px;margin:10px 0 0">⚠ ${t.missing} jour(s) sans sortie enregistrée ne sont pas comptés. Corrigez-les sur le site web.</p>` : ''}
    </div>
    <div class="foot">${BREAK_MINUTES ? `Pause de ${BREAK_MINUTES} min déduite chaque jour · ` : 'Pause non déduite · '}Heures = dernière sortie − première entrée</div></div>`;
}
/* ===================== DOCUMENTS (PDF per employee) ===================== */
const docPath = (wid, kind) => wid + '/' + kind + '.pdf';
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(b / 1024)) + ' Ko';
function docsCardHTML(w) {
  const mine = docs[w.id];
  const rows = DOC_TYPES.map(t => {
    const d = mine && mine[t.key], busyK = docBusy[w.id + '_' + t.key], k = esc(t.key), id = esc(w.id);
    const pick = label => `<label class="sm${d ? '' : ' em'}${busyK ? ' off' : ''}">${label}<input type="file" accept="application/pdf,.pdf" onchange="uploadDoc('${id}','${k}',this)"></label>`;
    return `<div class="doc"><div class="dtop"><div class="di${d ? '' : ' none'}">PDF</div>
      <div class="dt"><b>${esc(t.label)}</b><small>${busyK ? 'Envoi en cours…' : !mine ? 'Chargement…' : d ? esc(fmtSize(d.size)) + (d.at ? ' · ajouté le ' + esc(new Date(d.at).toLocaleDateString('fr-FR')) : '') : '<span class="dim">Aucun document</span>'}</small></div></div>
      <div class="da">${d ? `<button class="sm em${busyK ? ' off' : ''}" onclick="downloadDoc('${id}','${k}')">${ICON.down.replace('<svg', '<svg style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:5px"')}Télécharger</button>${pick('Remplacer')}<button class="sm rs${busyK ? ' off' : ''}" onclick="deleteDoc('${id}','${k}')" aria-label="Supprimer">✕</button>` : pick('+ Ajouter le PDF')}</div></div>`;
  }).join('');
  return `<div class="card"><h2>Documents</h2>${rows}</div>`;
}
async function loadDocs(wid) {
  try {
    const out = {};
    if (DEMO) { Object.keys(demoDocs[wid] || {}).forEach(k => { out[k] = { size: demoDocs[wid][k].size, at: demoDocs[wid][k].at }; }); }
    else {
      const { data, error } = await sb.storage.from(DOC_BUCKET).list(wid, { limit: 50 });
      if (error) throw error;
      (data || []).forEach(f => { const k = f.name.replace(/\.pdf$/i, ''); if (DOC_TYPES.some(t => t.key === k)) out[k] = { size: f.metadata && f.metadata.size || 0, at: f.updated_at || f.created_at }; });
    }
    docs[wid] = out;
  } catch (e) { docs[wid] = docs[wid] || {}; loadError = friendlyError(e); }
  if (openId === wid) render();
}
async function uploadDoc(wid, kind, input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  if (!(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) return alert('Veuillez choisir un fichier PDF.');
  if (f.size > DOC_MAX_MB * 1048576) return alert(`Fichier trop lourd (maximum ${DOC_MAX_MB} Mo).`);
  const bk = wid + '_' + kind; docBusy[bk] = true; render();
  try {
    if (DEMO) (demoDocs[wid] = demoDocs[wid] || {})[kind] = { file: f, size: f.size, at: new Date().toISOString() };
    else {
      const { error } = await sb.storage.from(DOC_BUCKET).upload(docPath(wid, kind), f, { upsert: true, contentType: 'application/pdf' });
      if (error) throw error;
    }
    await loadDocs(wid);
  } catch (e) { alert('Erreur : ' + friendlyError(e)); }
  docBusy[bk] = false; render();
}
async function downloadDoc(wid, kind) {
  const w = workers.find(x => x.id === wid), t = DOC_TYPES.find(x => x.key === kind); if (!w || !t) return;
  const name = (t.label + ' - ' + w.full_name).replace(/[\\/:*?"<>|]+/g, ' ') + '.pdf';
  try {
    let url;
    if (DEMO) url = URL.createObjectURL(demoDocs[wid][kind].file);
    else {
      const { data, error } = await sb.storage.from(DOC_BUCKET).createSignedUrl(docPath(wid, kind), 120, { download: name });
      if (error) throw error; url = data.signedUrl;
    }
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert('Erreur : ' + friendlyError(e)); }
}
async function deleteDoc(wid, kind) {
  const t = DOC_TYPES.find(x => x.key === kind);
  if (!confirm(`Supprimer « ${t.label} » ?\n\nLe fichier sera effacé définitivement.`)) return;
  const bk = wid + '_' + kind; docBusy[bk] = true; render();
  try {
    if (DEMO) delete (demoDocs[wid] || {})[kind];
    else { const { error } = await sb.storage.from(DOC_BUCKET).remove([docPath(wid, kind)]); if (error) throw error; }
    await loadDocs(wid);
  } catch (e) { alert('Erreur : ' + friendlyError(e)); }
  docBusy[bk] = false; render();
}

function renderLogin(msg) {
  started = false;
  app().innerHTML = `<div class="login"><form onsubmit="doLogin(event)"><div class="logo">M</div><h1>MAXI BAZAR</h1><p class="s">Personnel · connexion</p>
    <input id="em" type="email" required placeholder="Email" autocomplete="username" inputmode="email"><input id="pw" type="password" required placeholder="Mot de passe" autocomplete="current-password">
    <button class="go">Se connecter</button><div class="le" id="le">${esc(msg || '')}</div></form></div>`;
}
function render() {
  if (!started) return;
  const w = openId && workers.find(x => x.id === openId);
  app().innerHTML = w ? detailHTML(w) : listHTML();
}


/* ===================== ADD / EDIT / REMOVE EMPLOYEES ===================== */
let editingId = null, photoState;                 // photoState: undefined = unchanged, null = removed, text = new photo
function formHTML(w) {
  const v = k => esc(w && w[k] != null ? w[k] : '');
  return `<form class="f" onsubmit="saveForm(event)"><h3>${w ? "Modifier l'employé" : 'Ajouter un employé'}</h3>
    <div class="ph"><div class="pv" id="fPhotoPrev">${w && w.photo ? `<img src="${esc(w.photo)}" alt="">` : '👤'}</div>
      <div class="pb"><label>Photo<input id="fPhotoFile" type="file" accept="image/*" onchange="pickPhoto(this)"></label><button type="button" onclick="clearPhoto()">Retirer</button></div></div>
    <label>Nom &amp; prénom</label><input id="fName" required value="${v('full_name')}" autocomplete="off">
    <div class="g2"><div><label>Date de naissance</label><input type="date" id="fBirth" value="${v('birth_date')}"></div>
      <div><label>Sexe</label><select id="fSex"><option value="">-</option><option value="M"${w && w.sex === 'M' ? ' selected' : ''}>Homme</option><option value="F"${w && w.sex === 'F' ? ' selected' : ''}>Femme</option></select></div></div>
    <div class="g2"><div><label>Début de travail</label><input type="date" id="fHire" value="${v('hire_date')}"></div>
      <div><label>Salaire par heure (${CURRENCY})</label><input type="number" id="fRate" min="0" step="0.01" inputmode="decimal" placeholder="ex : 250" value="${v('hourly_rate')}"></div></div>
    <div class="g2"><div><label>Rayon (optionnel)</label><input id="fDept" list="depts" value="${v('department')}"><datalist id="depts"><option>Électronique</option><option>Vêtements / Mode</option><option>Maison &amp; Déco</option><option>Cosmétiques</option><option>Caisse Principale</option></datalist></div>
      <div><label>ID pointeuse</label><input id="fDev" required pattern="[0-9]{1,9}" inputmode="numeric" placeholder="ex : 7" value="${v('device_user_id')}"></div></div>
    <label>Heure d'arrivée prévue (après = retard)</label><input type="time" id="fStd" value="${w ? stdOf(w) : DEFAULT_STD}">
    <p class="note">L'ID doit être le même que le numéro de l'employé enregistré sur la pointeuse (c'est ce qui relie ses passages à son nom).</p>
    <div class="acts" style="margin-top:18px"><button type="button" class="btn" onclick="closeForm()">Annuler</button><button class="btn em">Enregistrer</button></div></form>`;
}
function openForm(id) {
  editingId = id || null; photoState = undefined;
  const w = id ? workers.find(x => x.id === id) : null;
  const sh = document.getElementById('sheet');
  sh.innerHTML = '<div class="box">' + formHTML(w) + '</div>';
  sh.classList.add('on'); document.body.style.overflow = 'hidden';
}
function closeForm() { document.getElementById('sheet').classList.remove('on'); document.body.style.overflow = ''; }
function setPhotoPrev(src) { document.getElementById('fPhotoPrev').innerHTML = src ? `<img src="${esc(src)}" alt="">` : '👤'; }
function resizePhoto(file) {                       // square 192px JPEG (~10 KB), stored directly in the database
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 192, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    img.src = url;
  });
}
async function pickPhoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try { photoState = await resizePhoto(f); setPhotoPrev(photoState); } catch (e) { alert('Photo : ' + e.message); }
}
function clearPhoto() { photoState = null; const f = document.getElementById('fPhotoFile'); if (f) f.value = ''; setPhotoPrev(null); }

async function saveForm(e) {
  e.preventDefault();
  const g = id => document.getElementById(id).value, rate = g('fRate');
  const rec = { full_name: g('fName').trim(), department: g('fDept').trim() || null, device_user_id: g('fDev').trim(), std_check_in: g('fStd') || DEFAULT_STD,
    birth_date: g('fBirth') || null, sex: g('fSex') || null, hire_date: g('fHire') || null,
    hourly_rate: rate === '' ? null : Math.max(0, parseFloat(rate) || 0) };
  if (photoState !== undefined) rec.photo = photoState;
  try {
    // is this machine ID already used? (also by a removed employee: then we bring that person back)
    let same = [];
    if (DEMO) same = workers.filter(x => x.device_user_id === rec.device_user_id);
    else { const r = await sb.from('workers').select('id,active,full_name').eq('device_user_id', rec.device_user_id); if (r.error) throw r.error; same = r.data || []; }
    const clash = same.find(x => x.id !== editingId);
    if (clash && clash.active) return alert(`Cet ID pointeuse est déjà utilisé par ${clash.full_name}.`);
    const id = editingId || (clash ? clash.id : null);
    if (!editingId && clash) rec.active = true;
    if (DEMO) {
      const i = workers.findIndex(x => x.id === id);
      if (i >= 0) Object.assign(workers[i], rec); else workers.push(Object.assign({ id: 'w' + Date.now(), active: true, created_at: new Date().toISOString() }, rec));
    } else {
      const { error } = id ? await sb.from('workers').update(rec).eq('id', id) : await sb.from('workers').insert(Object.assign({ active: true }, rec));
      if (error) throw error;
    }
    closeForm();
    await refresh(true);
  } catch (err) { alert('Erreur : ' + friendlyError(err)); }
}
async function removeWorker(id) {
  const w = workers.find(x => x.id === id); if (!w) return;
  if (!confirm(`Supprimer ${w.full_name} ?\n\nIl disparaît de la liste. Son historique reste conservé.`)) return;
  try {
    if (DEMO) w.active = false;
    else { const { error } = await sb.from('workers').update({ active: false }).eq('id', id); if (error) throw error; }
    cameFromList = false; location.hash = '';
    await refresh(true);
  } catch (err) { alert('Erreur : ' + friendlyError(err)); }
}

/* ===================== ACTIONS ===================== */
function onSearch(v) { query = v; const c = document.getElementById('cards'); if (c) c.innerHTML = cardsHTML(); }
function openWorker(id) { listScroll = window.scrollY; cameFromList = true; location.hash = '#w=' + encodeURIComponent(id); }
function goBack() { if (cameFromList) { cameFromList = false; history.back(); } else location.hash = ''; }
function route() {
  const m = location.hash.match(/^#w=(.+)$/);
  openId = m ? decodeURIComponent(m[1]) : null;
  render();
  window.scrollTo(0, openId ? 0 : listScroll);
  if (openId) loadDocs(openId);
}
async function changeWeek(d) {
  weekOffset = d === 0 ? 0 : weekOffset + d;
  render();                                                   // shows the loading blocks right away
  await refresh(false);
}
async function refresh(force, silent) {
  if (busy) return;
  busy = true; loadError = '';
  if (!silent) render();
  try {
    if (!workers.length || force) await loadWorkers();
    await loadWeek(weekStartStr(), force);
    updatedAt = new Date();
  } catch (e) { loadError = friendlyError(e); }
  busy = false; render();
}
async function installApp() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (_) {} installEvt = null; render(); }
async function doLogin(e) {
  e.preventDefault();
  const le = document.getElementById('le'); le.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
  if (error) { le.textContent = 'Email ou mot de passe incorrect.'; return; }
  start();
}
async function logout() { if (sb) await sb.auth.signOut(); workers = []; weeks = {}; docs = {}; renderLogin(); }

async function start() {
  started = true; openId = null;
  if (!timersOn) {
    timersOn = true;
    window.addEventListener('hashchange', route);
    const typing = () => document.activeElement && document.activeElement.tagName === 'INPUT';
    setInterval(() => { if (!document.hidden && started && !typing()) refresh(true, true); }, 60000);     // keep fresh while the app is open
    document.addEventListener('visibilitychange', () => { if (!document.hidden && started && (!updatedAt || Date.now() - updatedAt > 30000)) refresh(true, true); });
  }
  location.hash = '';
  render();
  await refresh(true);
  route();
}
async function boot() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (DEMO) { await start(); return; }
  if (typeof supabase === 'undefined') { app().innerHTML = '<div class="login"><div class="err">Connexion internet nécessaire pour la première ouverture. Vérifiez votre réseau puis rechargez.</div></div>'; return; }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) start(); else renderLogin();
}
boot();
</script>
